<!DOCTYPE html>
<html lang="fr" data-theme="light" data-mica="off" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<title>Portail Outils</title>
<link rel="stylesheet" href="styles/app.css">
</head>
<body>

<div class="app" id="app" data-rail="expanded">

  <!-- ── Rail de navigation ─────────────────────────────────────────────── -->
  <aside class="rail">
    <div class="rail-brand">
      <div class="rail-logo" id="rail-logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3.4" y="3.4" width="7.4" height="7.4" rx="2"></rect>
          <rect x="13.2" y="3.4" width="7.4" height="7.4" rx="2"></rect>
          <rect x="3.4" y="13.2" width="7.4" height="7.4" rx="2"></rect>
          <rect x="13.2" y="13.2" width="7.4" height="7.4" rx="2"></rect>
        </svg>
      </div>
      <div class="rail-brandtext">
        <div class="rail-title">Portail outils</div>
        <div class="rail-sub" id="rail-org"></div>
      </div>
    </div>

    <nav class="rail-scroll" id="rail-nav" aria-label="Navigation principale"></nav>

    <div class="rail-foot">
      <div class="rail-user">
        <div class="avatar" id="user-avatar" aria-hidden="true"></div>
        <div class="rail-usercol">
          <div class="rail-username" id="user-name"></div>
          <div class="rail-userorg" id="user-org"></div>
        </div>
      </div>
      <button class="iconbtn" id="btn-settings" title="Réglages" aria-label="Ouvrir les réglages">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M5 7h14M5 12h14M5 17h14"></path>
          <circle cx="9.5" cy="7" r="1.9" fill="currentColor" stroke="none"></circle>
          <circle cx="15" cy="12" r="1.9" fill="currentColor" stroke="none"></circle>
          <circle cx="8" cy="17" r="1.9" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>
    </div>
  </aside>

  <!-- ── Colonne principale ─────────────────────────────────────────────── -->
  <div class="main">

    <header class="topbar">
      <nav class="crumbs" id="crumbs" aria-label="Fil d'Ariane"></nav>

      <div class="search" id="search-wrap">
        <svg class="search-ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M16.5 16.5 21 21"></path>
        </svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               placeholder="Rechercher un outil…" aria-label="Rechercher un outil">
        <button class="search-clear" id="search-clear" aria-label="Effacer la recherche">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>

      <div class="topbar-actions">
        <button class="iconbtn" id="btn-help" title="Aide et raccourcis (F1)" aria-label="Aide et raccourcis clavier">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M9.6 9.3a2.5 2.5 0 1 1 3.2 2.4c-.6.2-.8.7-.8 1.3v.4"></path>
            <circle cx="12" cy="16.6" r="1" fill="currentColor" stroke="none"></circle>
          </svg>
        </button>
        <button class="iconbtn" id="btn-theme" title="Changer de thème" aria-label="Changer de thème"></button>
        <button class="iconbtn" id="btn-rail" title="Réduire ou déployer le menu" aria-label="Réduire ou déployer le menu">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.2" y="4.2" width="17.6" height="15.6" rx="2.6"></rect>
            <path d="M9.4 4.2v15.6"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="content" id="content" tabindex="-1"></main>

    <footer class="statusbar">
      <span id="status-estab"></span>
      <span class="grow"></span>
      <span class="status-chip" id="status-sync" data-state="ok"></span>
      <span id="status-version"></span>
    </footer>
  </div>
</div>

<!-- ── Palette de commandes (Ctrl+K) ──────────────────────────────────────── -->
<div class="scrim" id="palette" hidden>
  <div class="palette-wrap">
    <div class="palette" role="dialog" aria-modal="true" aria-labelledby="palette-label">
      <h2 class="visually-hidden" id="palette-label">Recherche globale et actions</h2>
      <div class="palette-input">
        <svg class="search-ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M16.5 16.5 21 21"></path>
        </svg>
        <input id="palette-input" type="text" role="combobox" aria-expanded="true"
               aria-controls="palette-list" aria-autocomplete="list" autocomplete="off"
               spellcheck="false" placeholder="Rechercher un outil, une catégorie ou une action…">
        <span class="kbd">Échap</span>
      </div>
      <ul class="palette-list" id="palette-list" role="listbox" aria-labelledby="palette-label"></ul>
      <div class="palette-foot">
        <span class="hint"><span class="kbd">↑</span><span class="kbd">↓</span> naviguer</span>
        <span class="hint"><span class="kbd">Entrée</span> ouvrir</span>
        <span class="hint"><span class="kbd">Ctrl</span><span class="kbd">Entrée</span> favori</span>
        <span class="spacer"></span>
        <span class="hint" id="palette-count"></span>
      </div>
    </div>
  </div>
</div>

<!-- ── Boîte de dialogue générique ────────────────────────────────────────── -->
<div class="scrim" id="dialog" hidden>
  <div class="dialog-wrap">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 class="dialog-title" id="dialog-title"></h2>
        <button class="iconbtn" id="dialog-close" aria-label="Fermer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>
      <div class="dialog-body" id="dialog-body"></div>
      <div class="dialog-foot" id="dialog-foot"></div>
    </div>
  </div>
</div>

<div class="toast-host" id="toast-host"></div>
<div class="visually-hidden" role="status" aria-live="polite" id="live"></div>

<script src="renderer/icons.js"></script>
<script src="renderer/app.js"></script>
</body>
</html>
